name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          
      - name: Install Dependencies
        run: npm install
        
      - name: Build Web Project
        run: npm run build --if-present
        
      - name: Sync Capacitor Android
        run: |
          npx cap sync
          
      - name: Repair Gradle Wrapper
        run: |
          cd android
          rebuild_wrapper() {
            curl -L https://gradle.org -o gradle.zip
            unzip -q gradle.zip
            mv gradle-8.2.1/lib/plugins/gradle-plugins-*.jar gradle/wrapper/gradle-wrapper.jar 2>/dev/null || true
            # Nutze lokales Java um den Wrapper sauber neu zu generieren
            gradle-8.2.1/bin/gradle wrapper --gradle-version 8.2.1
            rm -rf gradle.zip gradle-8.2.1
          }
          rebuild_wrapper
        
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
